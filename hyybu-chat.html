<!DOCTYPE html>
<html lang="pt">
<head>
<script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
<script defer data-domain="hyybu.pt" src="https://plausible.io/js/script.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hyybu — Fala com a Hyybu</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Raleway:wght@900&display=swap" rel="stylesheet">
<style>
    :root {
        --accent:   #1E6B8C;
        --accent-l: #3A98BD;
        --accent-bg:#E8F4F9;
        --text:     #0D0D0D;
        --muted:    #6B7280;
        --border:   #EFEFEF;
        --bg:       #F8F8F8;
        --white:    #FFFFFF;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); max-width:420px; margin:0 auto; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

    /* ── HEADER ── */
    .header { padding:20px 20px 16px; background:white; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; flex-shrink:0; }
    .back-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid var(--border); background:white; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); flex-shrink:0; }
    .hyybu-avatar { width:44px; height:44px; border-radius:50%; background:var(--accent-bg); border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
    .hyybu-avatar img { width:100%; height:100%; object-fit:cover; }
    .hyybu-info { flex:1; }
    .hyybu-name { font-size:16px; font-weight:900; color:var(--text); letter-spacing:-0.5px; font-family:'Outfit',sans-serif; }
    .hyybu-name .dot { color:var(--accent); }
    .hyybu-status { font-size:11px; color:var(--accent); font-weight:600; display:flex; align-items:center; gap:4px; margin-top:2px; }
    .status-dot { width:6px; height:6px; border-radius:50%; background:#00C96A; animation:pulse 2s infinite; }

    /* ── CHAT AREA ── */
    .chat-area { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .chat-area::-webkit-scrollbar { width:0; }

    /* ── MENSAGENS ── */
    .msg { display:flex; gap:8px; max-width:85%; animation:fadeUp 0.3s ease; }
    .msg.user { align-self:flex-end; flex-direction:row-reverse; }
    .msg.hyybu { align-self:flex-start; }

    .msg-avatar { width:30px; height:30px; border-radius:50%; background:var(--accent-bg); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; overflow:hidden; border:1.5px solid var(--border); }
    .msg-avatar img { width:100%; height:100%; object-fit:cover; }

    .msg-bubble { padding:10px 14px; border-radius:18px; font-size:14px; line-height:1.55; }
    .msg.hyybu .msg-bubble { background:white; border:1.5px solid var(--border); border-bottom-left-radius:4px; color:var(--text); }
    .msg.user .msg-bubble { background:var(--accent); color:white; border-bottom-right-radius:4px; }

    .msg-time { font-size:10px; color:var(--muted); margin-top:4px; padding:0 4px; }
    .msg.user .msg-time { text-align:right; }

    /* ── TYPING ── */
    .typing { display:none; align-self:flex-start; flex-shrink:0; padding:0 16px 8px; }
    .typing.visible { display:flex; gap:8px; align-items:center; }
    .typing-avatar { width:30px; height:30px; border-radius:50%; background:var(--accent-bg); border:1.5px solid var(--border); overflow:hidden; flex-shrink:0; }
    .typing-avatar img { width:100%; height:100%; object-fit:cover; }
    .typing-bubble { background:white; border:1.5px solid var(--border); border-radius:18px; border-bottom-left-radius:4px; padding:12px 16px; display:flex; gap:4px; align-items:center; }
    .typing-dot { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay:0.2s; }
    .typing-dot:nth-child(3) { animation-delay:0.4s; }

    /* ── SUGESTÕES ── */
    .suggestions { padding:8px 16px; display:flex; gap:8px; overflow-x:auto; flex-shrink:0; }
    .suggestions::-webkit-scrollbar { display:none; }
    .suggestion-btn { font-family:'Outfit',sans-serif; font-size:12px; font-weight:600; color:var(--accent); background:var(--accent-bg); border:1.5px solid rgba(30,107,140,0.2); border-radius:99px; padding:6px 14px; white-space:nowrap; cursor:pointer; transition:all 0.2s; flex-shrink:0; }
    .suggestion-btn:active { background:var(--accent); color:white; }

    /* ── INPUT ── */
    .input-area { padding:12px 16px 28px; background:white; border-top:1px solid var(--border); display:flex; gap:10px; align-items:flex-end; flex-shrink:0; }
    .chat-input { flex:1; font-family:'Outfit',sans-serif; font-size:14px; font-weight:500; color:var(--text); background:var(--bg); border:1.5px solid var(--border); border-radius:20px; padding:10px 16px; outline:none; resize:none; max-height:100px; line-height:1.4; transition:border-color 0.2s; }
    .chat-input::placeholder { color:var(--muted); }
    .chat-input:focus { border-color:var(--accent); }
    .send-btn { width:40px; height:40px; border-radius:50%; background:var(--accent); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; flex-shrink:0; }
    .send-btn:active { background:#155270; transform:scale(0.95); }
    .send-btn:disabled { background:var(--border); cursor:not-allowed; }

    /* ── WELCOME ── */
    .welcome-card { background:white; border:1.5px solid var(--border); border-radius:20px; padding:24px 20px; text-align:center; }
    .welcome-owl { width:80px; height:80px; border-radius:50%; background:var(--accent-bg); border:3px solid var(--accent); margin:0 auto 16px; overflow:hidden; }
    .welcome-owl img { width:100%; height:100%; object-fit:cover; }
    .welcome-title { font-family:'Raleway',sans-serif; font-size:20px; font-weight:900; color:var(--text); letter-spacing:-0.5px; margin-bottom:8px; }
    .welcome-title .dot { color:var(--accent); }
    .welcome-sub { font-size:13px; color:var(--muted); line-height:1.6; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-6px); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <button class="back-btn" onclick="history.back()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="hyybu-avatar">
        <img src="hyybu-owl.jpg" alt="Gufy, o assistente do hyybu.">
    </div>
    <div class="hyybu-info">
        <div class="hyybu-name">Gufy</div>
        <div class="hyybu-status"><span class="status-dot"></span> Online — aqui para ajudar</div>
    </div>
</div>

<!-- CHAT AREA -->
<div class="chat-area" id="chatArea">
    <div class="welcome-card">
        <div class="welcome-owl">
            <img src="hyybu-owl.jpg" alt="Hyybu">
        </div>
        <div class="welcome-title">Olá! Sou o Gufy</div>
        <div class="welcome-sub">O teu especialista pessoal de seguros — e de tudo sobre a hyybu<span style="font-weight:700;">.</span> Pergunta-me o que quiseres, estou aqui para ajudar!</div>
    </div>
</div>

<!-- TYPING -->
<div class="typing" id="typing">
    <div class="typing-avatar">
        <img src="hyybu-owl.jpg" alt="Hyybu">
    </div>
    <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
    </div>
</div>

<!-- SUGESTÕES -->
<div class="suggestions" id="suggestions">
    <button class="suggestion-btn" onclick="sendSuggestion(this)">O que cobre a minha RC?</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">A hyybu. é grátis?</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">Onde ficam os meus dados?</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">Tive um acidente, e agora?</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">Como funciona a leitura da apólice?</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">O que é uma franquia?</button>
    <button class="suggestion-btn" onclick="sendSuggestion(this)">Vale a pena seguro de saúde?</button>
</div>

<!-- INPUT -->
<div class="input-area">
    <textarea class="chat-input" id="chatInput" placeholder="Pergunta ao Gufy..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
</div>

<script>
let messages = [];

function getUserContext() {
    try {
        const entities = JSON.parse(localStorage.getItem('hubbu_entities_v1') || '[]');
        const activeId = localStorage.getItem('hubbu_active_entity') || '';
        const activeEntity = entities.find(e => e.id === activeId) || entities[0];
        const autoData = JSON.parse(localStorage.getItem('hubbu_auto_' + (activeEntity?.id || '')) || '{}');
        return {
            nome: activeEntity?.name || 'Utilizador',
            familia: entities.map(e => ({ nome: e.name, relacao: e.relation })),
            seguros: {
                auto: { ativo: activeEntity?.ramos?.auto || false, carros: autoData.cars || [] },
                lar: { ativo: activeEntity?.ramos?.lar || false },
                vida: { ativo: activeEntity?.ramos?.vida || false },
                saude: { ativo: activeEntity?.ramos?.saude || false },
                pet: { ativo: activeEntity?.ramos?.pet || false },
                bicicleta: { ativo: activeEntity?.ramos?.bicicleta || false }
            }
        };
    } catch(e) {
        return { nome: 'Utilizador', familia: [], seguros: {} };
    }
}

async function sendMessage(text) {
    const input = document.getElementById('chatInput');
    const userText = text || input.value.trim();
    if (!userText) return;

    document.getElementById('suggestions').style.display = 'none';
    input.value = '';
    autoResize(input);
    addMessage('user', userText);
    messages.push({ role: 'user', content: userText });

    const typing = document.getElementById('typing');
    typing.classList.add('visible');
    document.getElementById('sendBtn').disabled = true;
    scrollToBottom();

    try {
        const response = await fetch('/.netlify/functions/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages, userContext: getUserContext() })
        });
        const data = await response.json();
        const reply = data.message || 'Desculpa, não consegui responder. Tenta novamente.';
        messages.push({ role: 'assistant', content: reply });
        typing.classList.remove('visible');
        addMessage('hyybu', reply);
    } catch(e) {
        typing.classList.remove('visible');
        addMessage('hyybu', 'Ups! Tive um problema técnico. Tenta novamente daqui a pouco.');
    }

    document.getElementById('sendBtn').disabled = false;
    scrollToBottom();
}

function sendSuggestion(btn) { sendMessage(btn.textContent); }

function addMessage(role, text) {
    const area = document.getElementById('chatArea');
    const now = new Date().toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = role === 'hyybu'
        ? `<div class="msg-avatar"><img src="hyybu-owl.jpg" alt="Hyybu"></div>
           <div><div class="msg-bubble">${formatText(text)}</div><div class="msg-time">${now}</div></div>`
        : `<div><div class="msg-bubble">${escapeHtml(text)}</div><div class="msg-time">${now}</div></div>`;
    area.appendChild(div);
    scrollToBottom();
}

function formatText(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
             .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
}
function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function scrollToBottom() { const a=document.getElementById('chatArea'); setTimeout(()=>a.scrollTop=a.scrollHeight,100); }
function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
</script>
</body>
</html>
